- name: install docker
  hosts: controlplane
  become: true
  become_user: root
  vars:
    GOVERSION: "1.26.0"
    GOPROXY: "https://goproxy.cn,direct"
    CRIDOCKERDVERSION: 0.3.24
    cri_dockerd_arch_map:
      x86_64: amd64
      aarch64: arm64
  tasks:
    - name: remove installed docker packages on CentOS
      ansible.builtin.yum:
        name:
          - docker
          - docker-client
          - docker-client-latest
          - docker-common
          - docker-latest
          - docker-latest-logrotate
          - docker-logrotate
          - docker-engine
        state: removed
      when: ansible_facts['os_family'] == "RedHat"
    - name: install yum-utils packages on Centos
      ansible.builtin.yum:
        name:
          - dnf-plugins-core
        state: latest
      when: ansible_facts['os_family'] == "RedHat"
    - name: yum add docker repository on CentOS
      ansible.builtin.shell: dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
      when: ansible_facts['os_family'] == "RedHat"
    - name: install docker packages On CentOS
      ansible.builtin.yum:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: latest
      when: ansible_facts['os_family'] == "RedHat"
    - name: remove installed docker packages on Ubuntu
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          - docker-compose-v2
          - docker-doc
          - podman-docker
          - containerd
          - runc
        state: absent
      when: ansible_facts['os_family'] == "Debian"
    - name: install docker dependency packages On Ubuntu
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: latest
        update_cache: true
      when: ansible_facts['os_family'] == "Debian"
    - name: create Docker GPG Key directory on Ubuntu
      ansible.builtin.shell:
        cmd: install -m 0755 -d /etc/apt/keyrings
      when: ansible_facts['os_family'] == "Debian"
    - name: Add Docker GPG Key on Ubuntu
      ansible.builtin.shell:
        cmd: curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      register: result
      retries: 10
      delay: 3
      until: result.rc == 0
      when: ansible_facts['os_family'] == "Debian"
    - name: Chmod Docker GPG Key on Ubuntu
      ansible.builtin.shell:
        cmd: chmod a+r /etc/apt/keyrings/docker.asc
      when: ansible_facts['os_family'] == "Debian"
    - name: Add Docker repository on Ubuntu
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_facts.distribution_release }}
          Components: stable
          Signed-By: /etc/apt/keyrings/docker.asc
      when: ansible_facts['os_family'] == "Debian"
    - name: install docker packages On Ubuntu
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: latest
        update_cache: true
      when: ansible_facts['os_family'] == "Debian"
    - name: add user to docker user group
      ansible.builtin.user:
        name: vagrant
        append: true
        groups:
          - docker
    - name: enable and start docker service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
    - name: enable and start containerd service
      ansible.builtin.systemd:
        name: containerd
        state: started
        enabled: true
